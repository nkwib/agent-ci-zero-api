name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Replays the committed cassette. No API key, no secrets, no network
      # calls to any model provider. A prompt or tool-schema change misses the
      # cassette and fails here.
      - run: npm test
